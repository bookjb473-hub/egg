name: Build Android APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 1. เพิ่มการตั้งค่า Java JDK (จำเป็นมากสำหรับการ Build Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle' # ช่วยให้ Build ครั้งต่อไปเร็วขึ้น

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true # ช่วยแคช Flutter SDK เพื่อลดเวลา Build

      # 2. ปรับปรุงคำสั่งเพื่อป้องกันปัญหาทับซ้อนของไฟล์เดิม
      - name: Create Android project
        run: |
          if [ ! -d "android" ]; then
            flutter create --platforms=android .
          fi

      # 3. เคลียร์แคชเก่าก่อนเพื่อความชัวร์ว่าไม่ติดขัด
      - name: Clean project
        run: flutter clean

      - name: Get packages
        run: flutter pub get

      - name: Build APK
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: ESP32-EGG-PAM-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
